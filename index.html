<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Registro Gimnasio V18.6</title>
<meta name="theme-color" content="#0b1120"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#0b1120;--card:#1e293b;--input:#334155;--accent:#38bdf8;--text:#f8fafc;--muted:#94a3b8;--ok:#22c55e;--danger:#ef4444}*{box-sizing:border-box}body{margin:0 auto;max-width:900px;padding:10px;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}button,input,select{font:inherit}h1{display:flex;align-items:center;justify-content:center;gap:9px;color:var(--accent);font-size:1.5rem}.logo{width:50px;height:50px;border-radius:10px}.ver{font-size:.72rem;color:#fbbf24;border:1px solid #fbbf2460;border-radius:999px;padding:4px 8px}.box,.card{background:var(--card);border:1px solid #334155;border-radius:12px;padding:11px;margin:10px 0}.row{display:flex;gap:7px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}button{padding:10px;border-radius:8px;border:1px solid var(--accent);background:var(--input);color:var(--accent);font-weight:750;cursor:pointer}.primary{background:var(--accent);color:#0f172a}.green{background:var(--ok);border-color:var(--ok);color:#0f172a}.danger{color:#fca5a5;border-color:var(--danger);background:transparent}input,select{width:100%;padding:9px;border-radius:8px;border:1px solid #475569;background:var(--input);color:var(--text)}label{display:block;color:var(--muted);font-size:.84rem;margin:5px 0}.tabs{display:flex;overflow:auto;gap:6px}.tab.active{background:var(--accent);color:#0f172a}.hidden{display:none!important}.machine-head{display:flex;align-items:center;gap:8px}.machine-name{flex:1;color:var(--accent);font-weight:850;font-size:1.15rem}.details{display:none;margin-top:10px}.card.open .details{display:block}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.history-day{border:1px solid #475569;border-radius:9px;margin:7px 0;overflow:hidden}.history-title{background:#334155;padding:10px;display:flex;justify-content:space-between;cursor:pointer}.history-body{display:none;padding:8px}.history-day.open .history-body{display:block}.hist-item{padding:8px;border-left:3px solid var(--accent);background:var(--card);margin:5px 0}.tools-body{display:none}.tools.open .tools-body{display:block}.small{font-size:.82rem;color:var(--muted)}@media(max-width:520px){.fields{grid-template-columns:1fr}.row>*{min-width:100%}body{padding:7px}}
</style></head>
<body>
<h1><img class="logo" src="./icon-192.png" alt="Logo"><span>Registro de Gimnasio</span><span class="ver">V18.6</span></h1>
<section class="box"><b>👤 Perfil activo</b><div id="profiles" class="tabs"></div><div id="profileInfo" class="small"></div><div class="row"><button onclick="newProfile()">➕ Nuevo</button><button onclick="editProfile()">✏️ Editar perfil</button><button class="danger" onclick="deleteProfile()">🗑️ Borrar</button></div></section>
<section class="box"><button class="primary" onclick="toggle('newMachine')">➕ Añadir nueva máquina</button><div id="newMachine" class="hidden"><label>Nombre</label><input id="machineName"><label>Grupo muscular</label><select id="machineGroup"></select><button class="primary" onclick="addMachine()">Añadir</button></div></section>
<section class="box"><label>🔎 Mostrar grupo muscular</label><select id="groupFilter" onchange="renderMachines()"></select></section>
<div id="machines"></div>
<section class="box"><h3>📋 Historial de sesiones</h3><div id="history"></div></section>
<section class="box tools" id="tools"><button onclick="document.getElementById('tools').classList.toggle('open')">⚙️ Herramientas avanzadas</button><div class="tools-body"><div class="row"><button class="green" onclick="exportExcel()">📊 Exportar informe Excel</button><button onclick="document.getElementById('excelFile').click()">📥 Cargar / fusionar Excel</button><button onclick="exportJSON()">💾 Guardar copia JSON</button><button onclick="document.getElementById('jsonFile').click()">📂 Restaurar copia JSON</button></div><h4>Grupos musculares</h4><div id="groupManager"></div><div class="row"><input id="newGroupIcon" value="📦"><input id="newGroupName" placeholder="Nuevo grupo"><button onclick="addGroup()">Añadir</button></div></div></section>
<input id="excelFile" type="file" accept=".xlsx,.xls" hidden><input id="jsonFile" type="file" accept=".json" hidden>
<script>
const $=id=>document.getElementById(id), norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const G0=[{id:'piernas',nombre:'Piernas',icono:'🦵'},{id:'pecho',nombre:'Pecho',icono:'🏋️'},{id:'espalda',nombre:'Espalda',icono:'🫁'},{id:'hombros',nombre:'Hombros',icono:'🔷'},{id:'biceps',nombre:'Bíceps',icono:'💪'},{id:'triceps',nombre:'Tríceps',icono:'💪'},{id:'core',nombre:'Core',icono:'🔥'},{id:'cardio',nombre:'Cardio',icono:'🫀'},{id:'otro',nombre:'Otro',icono:'📦'}];
let perfiles=JSON.parse(localStorage.getItem('lista_perfiles')||'["jr","Esther","Paola","Dani"]'),perfil=localStorage.getItem('perfil_activo')||perfiles[0],grupos=JSON.parse(localStorage.getItem('catalogo_grupos_musculares_v185')||'null')||G0;
const keyM=p=>`mis_maquinas_${p}`,keyH=p=>`historial_sesiones_${p}`,keyP=p=>`datos_perfil_${p}`;
let maquinas=[],historial=[];function load(){maquinas=JSON.parse(localStorage.getItem(keyM(perfil))||'[]');historial=JSON.parse(localStorage.getItem(keyH(perfil))||'[]');renderAll()}function save(){localStorage.setItem(keyM(perfil),JSON.stringify(maquinas));localStorage.setItem(keyH(perfil),JSON.stringify(historial));}
function gp(id){return grupos.find(g=>g.id===id)||grupos.find(g=>g.id==='otro')||grupos[0]}function detect(n){n=norm(n);if(/cinta|treadmill|eliptica|bicicleta|bici|spinning/.test(n))return'cardio';if(/pierna|prensa|sentadilla|femoral|cuadriceps|gemelo|glute/.test(n))return'piernas';if(/pecho|banca|pectoral/.test(n))return'pecho';if(/espalda|jalon|remo|dominada/.test(n))return'espalda';if(/hombro|militar|deltoid/.test(n))return'hombros';if(/bicep|curl/.test(n))return'biceps';if(/tricep|fondos/.test(n))return'triceps';if(/abdominal|core|plancha|crunch/.test(n))return'core';return'otro'}
function isRun(n){n=norm(n);return n.includes('cinta')||n.includes('treadmill')}function isEll(n){n=norm(n);return n.includes('eliptica')||n.includes('orbitrek')}function isBike(n){n=norm(n);return n.includes('bici')||n.includes('bicicleta')||n.includes('spinning')||n.includes('stationary bike')}
function pdata(p=perfil){return JSON.parse(localStorage.getItem(keyP(p))||'{}')}function kcal(x,w){w=+w;if(!w)return 0;let min=+x.tiempo||0;if(isRun(x.maquina)){let k=+x.velocidad||0,g=Math.max(0,+x.inclinacion||0)/100,s=k*1000/60,v=k<8?.1*s+1.8*s*g+3.5:.2*s+.9*s*g+3.5;return Math.round(v*w*min*5/1000)}let met=isEll(x.maquina)?({baja:4.5,media:5.5,alta:7}[x.resistencia]||5.5):isBike(x.maquina)?({baja:4,media:6.8,alta:8.8}[x.resistencia]||6.8):3.5;if(!min)min=(+x.series||0)*2;return Math.round(met*3.5*w/200*min)}
function renderAll(){renderProfiles();renderGroups();renderMachines();renderHistory();renderGroupManager()}function renderProfiles(){$('profiles').innerHTML=perfiles.map(p=>`<button class="tab ${p===perfil?'active':''}" onclick="switchProfile('${esc(p)}')">${esc(p)}</button>`).join('');let d=pdata();$('profileInfo').textContent=d.peso?`🎂 ${d.edad||'-'} años · ⚖️ ${d.peso} kg · 📏 ${d.estatura||'-'} cm`:'Configura edad, peso y estatura'}function switchProfile(p){perfil=p;localStorage.setItem('perfil_activo',p);load()}
function newProfile(){let p=prompt('Nombre del nuevo perfil:');if(!p||perfiles.some(x=>norm(x)===norm(p)))return;perfiles.push(p.trim());localStorage.setItem('lista_perfiles',JSON.stringify(perfiles));switchProfile(p.trim())}function editProfile(){let d=pdata(),n=prompt('Nombre:',perfil);if(!n)return;let edad=prompt('Edad:',d.edad||''),peso=prompt('Peso (kg):',d.peso||''),est=prompt('Estatura (cm):',d.estatura||'');if(n!==perfil){localStorage.setItem(keyM(n),JSON.stringify(maquinas));localStorage.setItem(keyH(n),JSON.stringify(historial));localStorage.removeItem(keyM(perfil));localStorage.removeItem(keyH(perfil));perfiles[perfiles.indexOf(perfil)]=n;perfil=n;localStorage.setItem('lista_perfiles',JSON.stringify(perfiles));localStorage.setItem('perfil_activo',perfil)}localStorage.setItem(keyP(perfil),JSON.stringify({edad,peso,estatura:est}));renderAll()}function deleteProfile(){if(perfiles.length<2||!confirm('¿Borrar perfil?'))return;localStorage.removeItem(keyM(perfil));localStorage.removeItem(keyH(perfil));perfiles=perfiles.filter(p=>p!==perfil);localStorage.setItem('lista_perfiles',JSON.stringify(perfiles));switchProfile(perfiles[0])}
function renderGroups(){let opts=grupos.map(g=>`<option value="${g.id}">${g.icono} ${esc(g.nombre)}</option>`).join('');$('machineGroup').innerHTML=opts;$('groupFilter').innerHTML='<option value="todos">Todos los grupos</option>'+opts}function toggle(id){$(id).classList.toggle('hidden')}function addMachine(){let n=$('machineName').value.trim();if(!n)return;maquinas.push({id:Date.now(),nombre:n,grupoId:$('machineGroup').value||detect(n),fecha:'-'});$('machineName').value='';save();renderAll()}
function fields(m){if(isRun(m.nombre))return[['tiempo','Tiempo (min)'],['velocidad','Velocidad (km/h)'],['inclinacion','Inclinación (%)']];if(isEll(m.nombre))return[['pasos','Pasos'],['tiempo','Tiempo (min)'],['resistencia','Resistencia']];if(isBike(m.nombre))return[['velocidad','Velocidad (km/h)'],['tiempo','Tiempo (min)'],['resistencia','Resistencia']];return[['series','Series'],['reps','Repeticiones'],['peso','Peso (kg)']]}
function renderMachines(){let f=$('groupFilter').value||'todos';$('machines').innerHTML=maquinas.filter(m=>f==='todos'||m.grupoId===f).map(m=>`<article class="card" id="m${m.id}"><div class="machine-head"><button onclick="$('m${m.id}').classList.toggle('open')">▶</button><span class="machine-name">${esc(m.nombre)}</span><span>${gp(m.grupoId).icono} ${esc(gp(m.grupoId).nombre)}</span></div><div class="details"><div class="fields">${fields(m).map(([k,l])=>`<label>${l}<input id="${k}${m.id}" value="${esc(m[k]||'')}"></label>`).join('')}</div><div class="row"><button class="primary" onclick="record(${m.id})">✅ Registrar ejercicio</button><button onclick="editMachine(${m.id})">✏️ Editar</button><button class="danger" onclick="delMachine(${m.id})">🗑️ Borrar máquina</button></div></div></article>`).join('')||'<p class="small">No hay máquinas.</p>'}
function record(id){let m=maquinas.find(x=>x.id===id),s={id:Date.now(),fecha:new Date().toLocaleDateString('es-ES')+' '+new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}),maquina:m.nombre,maquinaId:m.id,grupoId:m.grupoId};fields(m).forEach(([k])=>{s[k]=$(`${k}${id}`).value;m[k]=s[k]});s.tipo=isRun(m.nombre)?'cinta':isEll(m.nombre)?'eliptica':isBike(m.nombre)?'bici':'fuerza';s.calorias=kcal(s,pdata().peso);m.fecha=s.fecha.split(' ')[0];historial.unshift(s);save();renderAll();alert(`Registrado · ${s.calorias} kcal estimadas`)}function editMachine(id){let m=maquinas.find(x=>x.id===id),n=prompt('Nombre:',m.nombre);if(!n)return;let g=prompt('ID grupo ('+grupos.map(x=>x.id).join(', ')+'):',m.grupoId);let old=m.nombre;m.nombre=n;m.grupoId=grupos.some(x=>x.id===g)?g:detect(n);historial.forEach(x=>{if(x.maquinaId===id||norm(x.maquina)===norm(old)){x.maquina=n;x.grupoId=m.grupoId}});save();renderAll()}function delMachine(id){if(confirm('¿Borrar máquina?')){maquinas=maquinas.filter(x=>x.id!==id);save();renderAll()}}
function renderHistory(){let days={};historial.forEach(x=>(days[x.fecha?.split(' ')[0]||'Sin fecha']??=[]).push(x));$('history').innerHTML=Object.entries(days).map(([d,a])=>`<div class="history-day"><div class="history-title" onclick="this.parentElement.classList.toggle('open')"><b>📅 ${d}</b><span>🔥 ${a.reduce((t,x)=>t+(+x.calorias||kcal(x,pdata().peso)),0)} kcal · ${a.length}</span></div><div class="history-body">${a.map(x=>`<div class="hist-item"><b>${esc(x.maquina)}</b> · ${gp(x.grupoId).nombre}<br><span class="small">${fields({nombre:x.maquina}).map(([k,l])=>`${l}: ${esc(x[k]??'-')}`).join(' · ')} · Calorías: ${x.calorias||0}</span></div>`).join('')}</div></div>`).join('')||'<p class="small">Sin registros.</p>'}
function renderGroupManager(){$('groupManager').innerHTML=grupos.map(g=>`<div class="row"><input id="gi${g.id}" value="${esc(g.icono)}"><input id="gn${g.id}" value="${esc(g.nombre)}"><button onclick="saveGroup('${g.id}')">Guardar</button></div>`).join('')}function saveGroup(id){let g=gp(id);g.icono=$('gi'+id).value||'📦';g.nombre=$('gn'+id).value||g.nombre;localStorage.setItem('catalogo_grupos_musculares_v185',JSON.stringify(grupos));renderAll()}function addGroup(){let n=$('newGroupName').value.trim();if(!n)return;grupos.push({id:'grupo_'+Date.now().toString(36),nombre:n,icono:$('newGroupIcon').value||'📦'});localStorage.setItem('catalogo_grupos_musculares_v185',JSON.stringify(grupos));renderAll()}
function exportExcel(){if(typeof XLSX==='undefined')return alert('Librería Excel no disponible.');let wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['ID grupo','Nombre','Icono','Orden'],...grupos.map((g,i)=>[g.id,g.nombre,g.icono,i+1])]),'__GRUPOS__');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Perfil','Edad','Peso (kg)','Estatura (cm)','Perfil activo'],...perfiles.map(p=>{let d=pdata(p);return[p,d.edad||'',d.peso||'',d.estatura||'',p===perfil?'Sí':'No']})]),'PERFILES');let any=false;perfiles.forEach(p=>{let rows=[['Fecha y Hora','Máquina','grupo','Series','Repeticiones','Peso (kg)','Tiempo (min)','Velocidad (km/h)','Inclinación (%)','Pasos','Resistencia','Calorías estimadas']];let h=JSON.parse(localStorage.getItem(keyH(p))||'[]');h.forEach(x=>{any=true;rows.push([x.fecha,x.maquina,gp(x.grupoId||detect(x.maquina)).nombre,x.series??'',x.reps??'',x.peso??'',x.tiempo??'',x.velocidad??'',x.inclinacion??'',x.pasos??'',x.resistencia??'',+x.calorias||kcal(x,pdata(p).peso)])});if(!h.length)rows.push(['Sin registros']);let ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[19,25,18,10,14,12,14,18,16,10,14,18].map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,ws,p.slice(0,30).replace(/[:\\/?*\[\]]/g,''))});if(!any)return alert('No hay registros.');XLSX.writeFile(wb,`Informe_Gimnasio_V18.6_${new Date().toISOString().slice(0,10)}.xlsx`)}
$('excelFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=ev=>{let wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'}),skip=new Set(['PERFILES','__GRUPOS__']);wb.SheetNames.filter(n=>!skip.has(n)).forEach(name=>{let rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:''}),p=perfiles.find(x=>norm(x)===norm(name))||name;if(!perfiles.includes(p))perfiles.push(p);let h=JSON.parse(localStorage.getItem(keyH(p))||'[]'),ms=JSON.parse(localStorage.getItem(keyM(p))||'[]');rows.forEach((z,i)=>{let machine=z['Máquina']||z['Maquina'];if(!machine||z['Fecha y Hora']==='Sin registros')return;let x={id:Date.now()+Math.random()+i,fecha:String(z['Fecha y Hora']||''),maquina:String(machine),grupoId:detect(machine),series:z['Series']||'',reps:z['Repeticiones']||'',peso:z['Peso (kg)']||'',tiempo:z['Tiempo (min)']||'',velocidad:z['Velocidad (km/h)']||'',inclinacion:z['Inclinación (%)']??'',pasos:z['Pasos']||'',resistencia:z['Resistencia']||'',calorias:+z['Calorías estimadas']||0};if(h.some(q=>q.fecha===x.fecha&&norm(q.maquina)===norm(x.maquina)))return;let m=ms.find(q=>norm(q.nombre)===norm(x.maquina));if(!m){m={id:Date.now()+Math.random(),nombre:x.maquina,grupoId:x.grupoId};ms.push(m)}x.maquinaId=m.id;Object.assign(m,x,{nombre:x.maquina});h.push(x)});localStorage.setItem(keyH(p),JSON.stringify(h));localStorage.setItem(keyM(p),JSON.stringify(ms))});localStorage.setItem('lista_perfiles',JSON.stringify(perfiles));load();alert('Importación completada')};r.readAsArrayBuffer(f);e.target.value=''};
function exportJSON(){let data={perfiles,perfilActual:perfil,gruposMusculares:grupos,maquinasPorPerfil:{},historialPorPerfil:{},datosPerfil:{}};perfiles.forEach(p=>{data.maquinasPorPerfil[p]=JSON.parse(localStorage.getItem(keyM(p))||'[]');data.historialPorPerfil[p]=JSON.parse(localStorage.getItem(keyH(p))||'[]');data.datosPerfil[p]=pdata(p)});let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='Backup_Gimnasio_V18.6.json';a.click()}$('jsonFile').onchange=e=>{let r=new FileReader();r.onload=ev=>{let d=JSON.parse(ev.target.result);perfiles=d.perfiles||perfiles;grupos=d.gruposMusculares||grupos;perfiles.forEach(p=>{localStorage.setItem(keyM(p),JSON.stringify(d.maquinasPorPerfil?.[p]||[]));localStorage.setItem(keyH(p),JSON.stringify(d.historialPorPerfil?.[p]||[]));localStorage.setItem(keyP(p),JSON.stringify(d.datosPerfil?.[p]||{}))});localStorage.setItem('lista_perfiles',JSON.stringify(perfiles));localStorage.setItem('catalogo_grupos_musculares_v185',JSON.stringify(grupos));switchProfile(d.perfilActual||perfiles[0])};r.readAsText(e.target.files[0])};
load();if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
